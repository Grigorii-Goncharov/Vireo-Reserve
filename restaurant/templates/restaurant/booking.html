{% extends 'restaurant/base.html' %}

{% block title %}Vireo Reserve — Бронирование столиков с видом на бухту{% endblock %}
{% load static %}
{% block content %}

<!-- Бронирование -->
<section id="booking" class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h2 class="text-center mb-4">Забронировать столик</h2>
        <form method="post" action="#">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Имя</label>
              <input type="text" class="form-control" name="first_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Телефон</label>
              <input type="tel" class="form-control" name="phone" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Дата</label>
              <input type="date" class="form-control" name="date" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Время</label>
              <input type="time" class="form-control" name="time" required>
            </div>
            <div class="col-12">
              <label class="form-label">Количество гостей</label>
              <input type="number" min="1" max="20" class="form-control" name="guests" required>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-success w-100">Забронировать</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

{% endblock %}
