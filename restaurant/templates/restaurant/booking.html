{% extends 'restaurant/base.html' %}
{% block title %}Бронирование столика | Vireo Reserve{% endblock %}
{% load static %}
{% include 'restaurant/includes/header.html' %}

{% block content %}
<style>
  body {
    margin: 0;
    background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.3)),
                  url('/static/media/main_photo.png') center/cover no-repeat fixed;
  }

  .booking-card {
    background: rgba(255, 255, 255, 0.94);
    border-radius: 20px;
    padding: 40px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .card-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .card-header h2 {
    font-weight: 700;
    color: #065f46;
    font-size: 28px;
    margin: 0;
  }

  .card-header p {
    color: #64748b;
    font-size: 16px;
    margin-top: 8px;
  }

  .input-group {
    margin-bottom: 20px;
  }

  .input-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #334155;
    font-size: 15px;
  }

  .input-group input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    transition: border-color 0.3s, box-shadow 0.2s;
    background: #fff;
  }

  .input-group input:focus {
    outline: none;
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
  }

  .btn-book {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #059669, #047857);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    margin-top: 8px;
  }

  .btn-book:hover {
    background: linear-gradient(135deg, #047857, #065f46);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
  }

  @media (max-width: 576px) {
    .booking-card {
      padding: 30px 20px;
      margin: 0 16px;
    }
  }
</style>

<div class="container d-flex justify-content-center align-items-start min-vh-100 py-4 py-md-5">
  <div class="booking-card">
    <div class="card-header">
      <h2>Забронировать столик</h2>
      <p>С видом на бухту Пхи-Пхи</p>
    </div>

    <form method="post" action="#">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <div class="input-group">
            <label for="first_name">Имя</label>
            <input type="text" class="form-control" id="first_name" name="first_name" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label for="phone">Телефон</label>
            <input type="tel" class="form-control" id="phone" name="phone" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label for="date">Дата</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <label for="time">Время</label>
            <input type="time" class="form-control" id="time" name="time" required>
          </div>
        </div>
        <div class="col-12">
          <div class="input-group">
            <label for="guests">Количество гостей</label>
            <input type="number" min="1" max="20" class="form-control" id="guests" name="guests" required>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn-book">
            Забронировать
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
